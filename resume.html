<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume — Kai Jie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1220;--ink:#dbe3f3;--muted:#97a3b8;--panel:#101a2b;--line:#1f2a44;--brand:#22c55e;--brand-2:#a7f3d0;
      --radius:18px;--shadow:0 10px 30px rgba(0,0,0,.35)
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(900px 500px at 10% -20%,rgba(34,197,94,.08),transparent),var(--bg);color:var(--ink);font:500 16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    a{color:var(--ink);text-decoration:none}
    .wrap{max-width:1120px;margin:0 auto;padding:32px 22px}
    .nav{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
    .nav a{opacity:.7;padding:8px 12px;border-radius:999px}
    .nav a.active,.nav a:hover{opacity:1;background:rgba(255,255,255,.04)}
    header{display:grid;gap:14px;margin-top:40px}
    .brand{font-weight:800;font-size:52px;letter-spacing:-.02em}
    .subtitle{font-size:22px;color:var(--muted)}
    .resume-btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#0b1220;font-weight:700}
    footer{color:var(--muted);text-align:center;padding:40px 0}
    @media (max-width:900px){
      .brand{font-size:42px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Kai Jie Lim</div>
      <nav class="nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="experience.html">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html" class="active">Resume</a>
      </nav>
    </header>
    <main>
      <h1>Resume</h1>
      <p>Want the one‑pager? Grab it here.</p>
      <a class="resume-btn" href="#" target="_blank" rel="noopener">Download PDF</a>
    </main>
    <footer>© <span id="y"></span> Kai Jie</footer>
  </div>
  <script>
    // year
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
