<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Experience — Kai Jie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b1220;--ink:#dbe3f3;--muted:#97a3b8;--panel:#101a2b;--line:#1f2a44;--brand:#22c55e;--brand-2:#a7f3d0;
      --radius:18px;--shadow:0 10px 30px rgba(0,0,0,.35)
    .timeline {
      margin: 40px 0;
    }
    .timeline-item {
      display: flex;
      align-items: center;
      margin-bottom: 56px;
    }
    .timeline-date {
      margin-right: 24px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      min-width: 120px;
      text-align: right;
    }
    .timeline-dot {
      width: 18px;
      height: 18px;
      background: var(--brand);
      border-radius: 50%;
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 3px var(--line);
      margin-right: 24px;
    }
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 18px;
      margin-left: 18px;
      min-width: 220px;
      max-width: 700px;
    }
    .timeline-item {
        position: relative;
        margin-bottom: 56px; /* more space between cards */
        min-height: 60px;
    }
    .timeline-dot {
        position: absolute;
        left: -60px;
        top: 28px;
        width: 18px;
        height: 18px;
        background: var(--brand);
        border-radius: 50%;
        border: 3px solid var(--bg);
        box-shadow: 0 0 0 3px var(--line);
    }
    .timeline-date {
        position: absolute;
        left: -150px;
        top: 24px;
        width: 90px;
        text-align: right;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
        white-space: nowrap;
    }
    footer{color:var(--muted);text-align:center;padding:40px 0}
    @media (max-width:900px){
      .brand{font-size:42px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Kai Jie Lim</div>
      <nav class="nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="experience.html" class="active">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html">Resume</a>
      </nav>
    </header>
    <main>
      <h1>Experience</h1>
      <div class="timeline">
        <div class="timeline-item">
            <div class="timeline-date">Aug 2024 - Dec 2025</div>
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <strong>Data Modelling and Engineering Intern</strong>
                <p>The Coca-Cola Company</p>
            </div>
            </div>
            </div>
            <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-date">July 2023 - Jan 2024</div>
            <div class="timeline-content">
                <strong>Work Experience 2</strong>
                <p>Details about your work experience go here.</p>
            </div>
        </div>
      </div>
    </main>
  <footer>© Kai Jie <span id="y"></span></footer>
  </div>
  <script>
    // year
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
